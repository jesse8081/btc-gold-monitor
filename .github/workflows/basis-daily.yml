name: basis-daily

on:
  schedule:
    - cron: "10 7 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "补历史日期 YYYY-MM-DD（留空=今天；填了就强制重算）"
        required: false

permissions:
  contents: write

concurrency:
  group: basis-daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 生成贴水日报
        env:
          IN_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$IN_DATE" ]; then
            python track_basis.py --date "$IN_DATE" --force
          else
            python track_basis.py
          fi
      - name: 提交报告
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d reports ]; then git add -A reports; fi
          if git diff --staged --quiet; then
            echo "无新报告（非交易日或报告已存在）"
            exit 0
          fi
          git commit -m "basis: $(date -u +%F)"
          git push
